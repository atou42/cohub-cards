<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Cohub</title>
    <style>:root {
  color-scheme: light dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

* { box-sizing: border-box; }
body { margin: 0; background: transparent; }
button, summary { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

#cohub-card, .cohub-mount {
  --card-bg: #fff;
  --card-canvas: #f6f6f3;
  --card-ink: #262722;
  --card-muted: #85877e;
  --card-line: #eaece5;
  --card-hover: #f2f3ef;
  --card-positive: #65816b;
  --card-error: #a45143;
  --card-error-bg: #faf1ed;
  color: var(--card-ink);
}

@media (prefers-color-scheme: dark) {
  #cohub-card:not([data-theme="light"]), .cohub-mount:not([data-theme="light"]) {
    --card-bg: #22231f;
    --card-canvas: #1a1b18;
    --card-ink: #efefe8;
    --card-muted: #a3a69a;
    --card-line: #373930;
    --card-hover: #30322b;
    --card-positive: #a0b89c;
    --card-error: #e3a394;
    --card-error-bg: #382a25;
  }
}

#cohub-card[data-theme="dark"], .cohub-mount[data-theme="dark"] {
  color-scheme: dark;
  --card-bg: #22231f;
  --card-canvas: #1a1b18;
  --card-ink: #efefe8;
  --card-muted: #a3a69a;
  --card-line: #373930;
  --card-hover: #30322b;
  --card-positive: #a0b89c;
  --card-error: #e3a394;
  --card-error-bg: #382a25;
}

#cohub-card[data-theme="light"], .cohub-mount[data-theme="light"] { color-scheme: light; }

.cohub-card {
  width: 100%;
  overflow: hidden;
  border: 1px solid var(--card-line);
  border-radius: 20px;
  background: var(--card-bg);
  color: var(--card-ink);
  font-size: 13px;
  line-height: 1.5;
}

.card-rail {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 15px 22px;
  min-height: 52px;
  font-size: 11px;
  color: var(--card-muted);
}
.card-origin { display: flex; align-items: baseline; gap: 12px; }
.cohub-wordmark { color: var(--card-ink); font-size: 15px; font-weight: 650; letter-spacing: -.045em; }
.card-kind { font-size: 11px; }
.card-status { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none; }
[data-status="completed"] .card-status, [data-status="published"] .card-status { color: var(--card-positive); }
[data-status="failed"] .card-status, [data-status="error"] .card-status, [data-stale="true"] .card-status { color: var(--card-error); }
[data-status="pending"] .status-dot, [data-status="running"] .status-dot { animation: breathe 2.2s ease-in-out infinite; }

.card-media { background: var(--card-canvas); }
.media-grid { display: grid; }
.media-grid--multiple { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
.media-item { position: relative; margin: 0; min-width: 0; display: grid; align-content: center; }
.work-media { display: block; width: 100%; height: auto; max-height: 720px; object-fit: contain; }
video.work-media { min-height: 180px; }
.media-index { position: absolute; bottom: 10px; left: 12px; color: #fff; background: #0007; border-radius: 4px; padding: 2px 5px; font-size: 10px; font-variant-numeric: tabular-nums; }
.media-item--audio { min-height: 140px; padding: 24px 28px; gap: 16px; }
.media-grid--multiple .media-item--audio { order: 1; grid-column: 1 / -1; }
.audio-label { color: var(--card-muted); font-size: 12px; text-align: center; letter-spacing: .04em; }
.media-item--audio .work-media { height: 44px; }
.media-item[data-error="true"] { min-height: 260px; }
.media-item[data-error="true"] .work-media { max-height: 200px; }
.media-error { text-align: center; font-size: 12px; line-height: 1.8; color: var(--card-error); padding: 18px 24px; }

.empty-stage { min-height: clamp(280px, 48vw, 430px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 48px 32px; text-align: center; }
.stage-title { margin: 0; font-size: 15px; font-weight: 450; }
.stage-note { margin: 0; color: var(--card-muted); font-size: 12px; line-height: 1.8; }
.waiting-mark { font-size: 32px; color: var(--card-muted); margin: -20px 0 10px; }
.working-mark { display: block; width: 25px; height: 25px; border: 1px solid var(--card-line); border-top-color: var(--card-muted); border-radius: 50%; margin-bottom: 19px; animation: turn 2.5s linear infinite; }
.empty-stage--publication { gap: 15px; align-items: flex-start; text-align: left; padding: 48px; }
.stage-eyebrow { color: var(--card-muted); font-size: 11px; letter-spacing: .08em; }
.publication-name { margin: 0; font-size: clamp(25px, 5vw, 42px); max-width: 90%; letter-spacing: -.04em; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.stage-address { color: var(--card-muted); font-size: 13px; }
.empty-stage--publication .stage-note { margin-top: 30px; font-size: 10px; }

.card-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 22px; }
.card-caption { flex: 1; min-width: 0; }
.card-title { margin: 0; font-size: 16px; font-weight: 520; line-height: 1.6; letter-spacing: -.015em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { color: var(--card-muted); margin: 6px 0 0; font-size: 11px; }
.card-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }
.card-button { border: 1px solid var(--card-line); border-radius: 999px; color: var(--card-ink); background: transparent; padding: 8px 13px; font: inherit; font-size: 12px; line-height: 1.4; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap; transition: background 140ms, opacity 140ms; }
.card-button svg { width: 14px; height: 14px; flex: none; }
.card-button:hover:not(:disabled) { background: var(--card-hover); }
.card-button:disabled { opacity: .4; cursor: default; }
.card-button--primary { color: var(--card-bg); background: var(--card-ink); border-color: var(--card-ink); }
.card-button--primary:hover:not(:disabled) { background: var(--card-ink); opacity: .8; }
.card-button:focus-visible, summary:focus-visible { outline: 2px solid var(--card-positive); outline-offset: 4px; }

.card-notices:empty { display: none; }
.card-notices { padding: 0 22px 17px; }
.card-notice { margin: 0 0 6px; font-size: 12px; line-height: 1.8; color: var(--card-muted); overflow-wrap: anywhere; white-space: pre-line; }
.card-notice:last-child { margin-bottom: 0; }
.card-notice--error { color: var(--card-error); border-left: 2px solid currentColor; padding-left: 10px; }

.card-details { border-top: 1px solid var(--card-line); font-size: 11px; color: var(--card-muted); }
.card-details > summary { display: flex; align-items: center; gap: 5px; list-style: none; width: fit-content; padding: 13px 22px; cursor: pointer; user-select: none; }
.card-details > summary::-webkit-details-marker { display: none; }
.card-details > summary svg { width: 12px; height: 12px; transition: transform 150ms; }
.card-details[open] > summary svg { transform: rotate(180deg); }
.details-content { padding: 4px 22px 22px; }
.details-list { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 9px 20px; margin: 0; font-size: 11px; line-height: 1.65; }
.details-list dt { color: var(--card-muted); }
.details-list dd { margin: 0; color: var(--card-ink); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; user-select: text; }
.media-links { display: grid; gap: 15px; margin-top: 21px; }
.media-link { display: grid; justify-items: start; gap: 6px; }
.media-link .card-button { padding: 6px 10px; font-size: 11px; }
.detail-url { display: block; max-width: 100%; overflow-wrap: anywhere; user-select: text; color: var(--card-muted); line-height: 1.65; font-size: 10px; }

@media (max-width: 500px) {
  .cohub-card { border-radius: 16px; }
  .card-rail { padding: 13px 17px; }
  .card-footer { align-items: flex-start; flex-direction: column; gap: 16px; padding: 20px 17px; }
  .card-actions { justify-content: flex-start; }
  .card-notices { padding-left: 17px; padding-right: 17px; }
  .card-details > summary { padding-left: 17px; padding-right: 17px; }
  .details-content { padding-left: 17px; padding-right: 17px; }
  .empty-stage--publication { padding: 36px 27px; }
  .publication-name { max-width: 100%; }
  .media-item--audio { padding: 24px 14px; }
}

@keyframes breathe { 50% { opacity: .25; } }
@keyframes turn { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.cohub-composer {
  color: var(--card-ink); background: var(--card-bg);
  border: 1px solid var(--card-line); border-radius: 20px; overflow: hidden;
  font-size: 13px; line-height: 1.55;
}
.cohub-composer [hidden] { display: none !important; }
.composer-rail { display: flex; align-items: center; justify-content: space-between; padding: 15px 22px; min-height: 52px; }
.composer-status, .composer-save-state { font-size: 11px; color: var(--card-muted); }
.composer-stage { background: var(--card-canvas); }
.composer-empty { min-height: clamp(250px, 43vw, 380px); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; padding: 40px 30px; text-align: center; }
.composer-empty-mark { font-size: 28px; font-weight: 300; color: var(--card-muted); margin-bottom: 12px; opacity: .65; }
.composer-empty-title { margin: 0; font-size: 16px; font-weight: 450; letter-spacing: -.02em; }
.composer-help { margin: 0; color: var(--card-muted); font-size: 11px; line-height: 1.8; overflow-wrap: anywhere; }
.composer-reference-preview { display: grid; }
.composer-reference-preview--grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
.composer-reference-preview img { display: block; width: 100%; max-height: 540px; height: auto; object-fit: contain; min-width: 0; }
.composer-preview-caption { margin: 0; padding: 9px 22px; color: var(--card-muted); font-size: 10px; }
.composer-result .cohub-card { border: 0; border-radius: 0; }
.composer-result .card-rail, .composer-result .card-footer { display: none; }
/* Polling and capability notices belong to the composer; result failures remain visible. */
.composer-result .card-notice--info { display: none; }
.composer-result .card-notices { padding-top: 14px; }
.composer-result .card-notices:has(.card-notice--info:only-child) { display: none; }

.composer-editor { padding: 23px 22px 0; }
.composer-model { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 17px; }
.composer-model-select { max-width: 66%; border-color: transparent !important; padding-left: 0 !important; font-weight: 550; background-color: transparent !important; }
.composer-price { font-size: 10px; color: var(--card-muted); text-align: right; }
.cohub-composer input, .cohub-composer select, .cohub-composer textarea { font: inherit; color: var(--card-ink); background: var(--card-bg); border: 1px solid var(--card-line); border-radius: 9px; padding: 9px 10px; min-width: 0; max-width: 100%; }
.cohub-composer textarea { resize: vertical; line-height: 1.7; }
.cohub-composer input::placeholder, .cohub-composer textarea::placeholder { color: var(--card-muted); opacity: .8; }
.cohub-composer input:focus, .cohub-composer textarea:focus, .cohub-composer select:focus { outline: 1px solid var(--card-muted); outline-offset: 1px; }
.cohub-composer [aria-invalid="true"] { border-color: var(--card-error); }
.cohub-composer input:disabled, .cohub-composer select:disabled, .cohub-composer textarea:disabled { opacity: .58; cursor: default; }
.composer-prompt-input { width: 100%; min-height: 112px; padding: 0 !important; border: 0 !important; border-radius: 0 !important; font-size: 15px !important; background: transparent !important; }
.composer-prompt-input:focus { outline: none !important; }
.composer-common, .composer-field-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 14px; }
.composer-common:not(:empty) { padding: 19px 0 22px; }
.composer-field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.composer-field-label { font-size: 10px; color: var(--card-muted); }
.composer-field--wide { grid-column: 1 / -1; }
.composer-field input, .composer-field select, .composer-field textarea { width: 100%; font-size: 12px; }
.composer-disclosure { border-top: 1px solid var(--card-line); }
.composer-disclosure > summary { color: var(--card-muted); font-size: 11px; cursor: pointer; padding: 14px 0; list-style-position: inside; width: fit-content; }
.composer-field-grid { padding: 6px 0 21px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.composer-reference-content { padding: 5px 0 20px; }
.composer-reference-row { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.composer-reference-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.composer-reference-row select { max-width: 125px; font-size: 11px; padding: 6px 8px; }
.composer-weight { width: 72px; font-size: 11px !important; padding: 6px 8px !important; }
.composer-reference-add { display: flex; align-items: center; gap: 7px; margin: 15px 0 10px; }
.composer-reference-add select { max-width: 115px; font-size: 11px; padding: 8px 6px; }
.composer-reference-add input { flex: 1; width: 100%; font-size: 12px; }
.composer-small-button, .composer-text-button, .composer-generate { font: inherit; cursor: pointer; }
.composer-small-button { font-size: 11px; line-height: 1.4; padding: 8px 11px; border: 1px solid var(--card-line); border-radius: 999px; background: transparent; color: var(--card-ink); white-space: nowrap; }
.composer-small-button:hover:not(:disabled) { background: var(--card-hover); }
.composer-text-button { color: var(--card-muted); border: 0; padding: 6px 0; background: transparent; font-size: 11px; }
.composer-file-label { display: inline-flex; align-items: center; gap: 12px; color: var(--card-muted); font-size: 11px; max-width: 100%; margin-bottom: 12px; }
.composer-file-input { width: 185px; padding: 0 !important; border: 0 !important; font-size: 10px !important; }
.composer-file-input::file-selector-button { font: inherit; font-size: 10px; padding: 5px 8px; color: var(--card-ink); background: var(--card-bg); border: 1px solid var(--card-line); border-radius: 6px; margin-right: 8px; cursor: pointer; }
.composer-feedback:empty { display: none; }
.composer-feedback { padding: 4px 22px 0; }
.composer-notice { margin: 0 0 8px; color: var(--card-error); font-size: 11px; line-height: 1.8; white-space: pre-line; overflow-wrap: anywhere; }
.composer-notice--info { color: var(--card-muted); }
.composer-conflict-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 15px; }
.composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 22px 23px; }
.composer-actions { display: flex; align-items: center; gap: 20px; }
.composer-display-mode { white-space: nowrap; }
.composer-generate { border: 0; border-radius: 999px; background: var(--card-ink); color: var(--card-bg); font-size: 12px; padding: 10px 23px; min-width: 78px; }
.composer-generate:hover:not(:disabled) { opacity: .8; }
.cohub-composer button:disabled { opacity: .35; cursor: default; }
.cohub-composer button:focus-visible, .composer-disclosure > summary:focus-visible { outline: 2px solid var(--card-positive); outline-offset: 3px; }

@media (max-width: 500px) {
  .cohub-composer { border-radius: 16px; }
  .composer-rail { padding: 13px 17px; }
  .composer-editor { padding: 20px 17px 0; }
  .composer-footer { padding: 17px 17px 21px; }
  .composer-feedback { padding-left: 17px; padding-right: 17px; }
  .composer-model { gap: 12px; }
  .composer-price { max-width: 35%; }
  .composer-common { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .composer-reference-add { flex-wrap: wrap; }
  .composer-reference-add input { flex-basis: 60%; }
  .composer-reference-row { flex-wrap: wrap; }
  .composer-reference-name { flex-basis: 100%; }
  .composer-empty { min-height: 240px; }
}

/* The host's confirmed mode selects the layout; width only adjusts spacing. */
.cohub-composer[data-layout="inline"] .composer-rail { min-height: 42px; padding-top: 10px; padding-bottom: 10px; }
.cohub-composer[data-layout="inline"] .composer-stage { max-height: 280px; overflow: auto; }
.cohub-composer[data-layout="inline"] .composer-empty { min-height: 0; padding: 18px 22px; gap: 4px; align-items: flex-start; text-align: left; }
.cohub-composer[data-layout="inline"] .composer-empty-mark { display: none; }
.cohub-composer[data-layout="inline"] .composer-empty-title { font-size: 12px; }
.cohub-composer[data-layout="inline"] .composer-reference-preview img,
.cohub-composer[data-layout="inline"] .work-media { max-height: 260px; }
.cohub-composer[data-layout="inline"] .composer-result .empty-stage { min-height: 100px; padding: 20px; }
.cohub-composer[data-layout="inline"] .composer-result .card-details { display: none; }
.cohub-composer[data-layout="inline"] .composer-editor { padding-top: 16px; }
.cohub-composer[data-layout="inline"] .composer-model { margin-bottom: 10px; }
.cohub-composer[data-layout="inline"] .composer-prompt-input { height: 3.4em; min-height: 0; resize: none; overflow: auto; }
.cohub-composer[data-layout="inline"] .composer-footer { padding-top: 13px; padding-bottom: 16px; }
</style>
