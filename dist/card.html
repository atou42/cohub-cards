  --selected: oklch(100% 0 0);
  --line: oklch(91.5% .005 250);
  --line-strong: oklch(85% .008 250);
  --line-heavy: oklch(76% .01 250);
  --dots: oklch(84% .007 250);
  --ink: oklch(14% .004 250);
  --ink-2: oklch(35% .008 250);
  --ink-3: oklch(50% .01 250);
  --ink-4: oklch(64% .012 250);
  --ink-5: oklch(78% .01 250);
  --brand: oklch(58% .18 30);
  --brand-hover: oklch(52% .2 30);
  --brand-ink: oklch(51% .19 30);
  --on-brand: oklch(100% 0 0);
  --success: oklch(50% .12 160);
  --warning: oklch(56% .13 72);
  --danger: oklch(50% .17 25);
  --shadow-1: 0 1px 2px oklch(0% 0 0 / .06);
  --shadow-2: 0 1px 2px oklch(0% 0 0 / .05), 0 6px 18px oklch(0% 0 0 / .07);
  --media-scrim: oklch(0% 0 0 / .52);

  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.cohub-mount, .cohub-mount[data-theme="light"] { color-scheme: light; }

@media (prefers-color-scheme: dark) {
  .cohub-mount:not([data-theme="light"]) {
    color-scheme: dark;
    --card: oklch(22% .005 250);
    --canvas: oklch(18.5% .004 250);
    --field: oklch(25.5% .006 250);
    --hover: oklch(28% .007 250);
    --active: oklch(33% .008 250);
    --selected: oklch(36% .009 250);
    --line: oklch(30.5% .007 250);
    --line-strong: oklch(38% .008 250);
    --line-heavy: oklch(47% .01 250);
    --dots: oklch(31% .007 250);
    --ink: oklch(94% .004 250);
    --ink-2: oklch(82% .006 250);
    --ink-3: oklch(70% .008 250);
    --ink-4: oklch(58% .01 250);
    --ink-5: oklch(47% .01 250);
    --brand: oklch(60% .2 30);
    --brand-hover: oklch(55% .22 30);
    --brand-ink: oklch(71% .15 30);
    --on-brand: oklch(98% .003 250);
    --success: oklch(72% .13 160);
    --warning: oklch(80% .12 80);
    --danger: oklch(71% .16 25);
    --shadow-1: 0 1px 2px oklch(0% 0 0 / .24);
    --shadow-2: 0 1px 2px oklch(0% 0 0 / .24), 0 8px 24px oklch(0% 0 0 / .28);
  }
}

.cohub-mount[data-theme="dark"] {
  color-scheme: dark;
  --card: oklch(22% .005 250);
  --canvas: oklch(18.5% .004 250);
  --field: oklch(25.5% .006 250);
  --hover: oklch(28% .007 250);
  --active: oklch(33% .008 250);
  --selected: oklch(36% .009 250);
  --line: oklch(30.5% .007 250);
  --line-strong: oklch(38% .008 250);
  --line-heavy: oklch(47% .01 250);
  --dots: oklch(31% .007 250);
  --ink: oklch(94% .004 250);
  --ink-2: oklch(82% .006 250);
  --ink-3: oklch(70% .008 250);
  --ink-4: oklch(58% .01 250);
  --ink-5: oklch(47% .01 250);
  --brand: oklch(60% .2 30);
  --brand-hover: oklch(55% .22 30);
  --brand-ink: oklch(71% .15 30);
  --on-brand: oklch(98% .003 250);
  --success: oklch(72% .13 160);
  --warning: oklch(80% .12 80);
  --danger: oklch(71% .16 25);
  --shadow-1: 0 1px 2px oklch(0% 0 0 / .24);
  --shadow-2: 0 1px 2px oklch(0% 0 0 / .24), 0 8px 24px oklch(0% 0 0 / .28);
}

.cohub-mount {
  --brand-soft: color-mix(in oklab, var(--brand) 10%, transparent);
  --brand-softer: color-mix(in oklab, var(--brand) 5%, transparent);
  --brand-line: color-mix(in oklab, var(--brand) 26%, transparent);
  --brand-ring: color-mix(in oklab, var(--brand) 24%, transparent);
  --danger-soft: color-mix(in oklab, var(--danger) 9%, transparent);
  --danger-line: color-mix(in oklab, var(--danger) 26%, transparent);
  --warning-soft: color-mix(in oklab, var(--warning) 11%, transparent);
  --success-soft: color-mix(in oklab, var(--success) 12%, transparent);
}

/* ---------- Shell ---------- */
.cc-shell {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-1);
}

.cc-rail {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 44px;
  padding: 6px 8px 6px 14px;
}
.cc-origin { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cohub-mark {
  flex: none;
  width: 18px; height: 18px;
  border-radius: 5px;
  background: var(--brand);
  color: var(--on-brand);
  display: grid; place-items: center;
  font: 650 11px/1 var(--font-sans);
  letter-spacing: -.02em;
}
.cohub-mark::before { content: "C"; }
.cohub-wordmark { color: var(--ink); font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
.cc-crumb { display: inline-flex; align-items: center; gap: 8px; min-width: 0; color: var(--ink-3); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-crumb:not(:empty)::before { content: ""; width: 1px; height: 12px; background: var(--line-strong); flex: none; }
.cc-rail-end { display: flex; align-items: center; gap: 4px; flex: none; }

/* ---------- Status ---------- */
.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 8px;
  border-radius: var(--r-pill);
  color: var(--ink-3);
  font-size: 12px; white-space: nowrap;
}
.status-pill:empty { display: none; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.status-pill[data-tone="live"] { color: var(--brand-ink); background: var(--brand-softer); }
.status-pill[data-tone="live"] .status-dot { animation: cc-breathe 1.6s ease-in-out infinite; }
.status-pill[data-tone="done"] { color: var(--success); }
.status-pill[data-tone="error"] { color: var(--danger); background: var(--danger-soft); }
.status-pill[data-tone="warn"] { color: var(--warning); background: var(--warning-soft); }
.status-pill[data-tone="quiet"] .status-dot { background: var(--ink-4); }

/* ---------- Buttons ---------- */
.cc-button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-pill);
  background: var(--card);
  color: var(--ink);
  font: 500 12.5px/1 var(--font-sans);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease), transform 150ms var(--ease), opacity 150ms var(--ease);
}
.cc-button:hover:not(:disabled) { background: var(--hover); border-color: var(--line-heavy); }
.cc-button:active:not(:disabled) { transform: scale(.98); }
.cc-button:disabled { opacity: .45; cursor: default; }
.cc-button .icon { flex: none; }
.cc-button--primary { background: var(--brand); border-color: transparent; color: var(--on-brand); }
.cc-button--primary:hover:not(:disabled) { background: var(--brand-hover); border-color: transparent; }
.cc-button--quiet { border-color: transparent; background: transparent; color: var(--ink-2); padding: 0 10px; }
.cc-button--quiet:hover:not(:disabled) { background: var(--hover); border-color: transparent; color: var(--ink); }
.cc-button--small { height: 26px; padding: 0 10px; font-size: 12px; }

.cohub-mount :focus-visible { outline: 2px solid var(--brand-line); outline-offset: 2px; }
.cohub-mount button:focus-visible, .cohub-mount summary:focus-visible { outline: 0; box-shadow: 0 0 0 3px var(--brand-ring); }

/* ---------- Notices ---------- */
.cc-notice {
  display: flex; align-items: flex-start; gap: 8px;
  margin: 0;
  padding: 8px 10px;
  border-radius: 10px;
  font-size: 12.5px; line-height: 18px;
  color: var(--ink-2);
  background: var(--field);
  overflow-wrap: anywhere;
  white-space: pre-line;
}
.cc-notice .icon { flex: none; margin-top: 1px; }
.cc-notice-text { flex: 1; min-width: 0; }
.cc-notice--error { color: var(--danger); background: var(--danger-soft); }
.cc-notice--warn { color: var(--ink); background: var(--warning-soft); }
.cc-notice--warn .icon { color: var(--warning); }
.cc-notice--hint { background: transparent; padding: 2px 2px; color: var(--ink-3); }

/* ---------- Details ---------- */
.cc-details { border-top: 1px solid var(--line); }
.cc-details > summary {
  display: flex; align-items: center; gap: 4px;
  width: fit-content;
  padding: 12px 16px;
  list-style: none;
  color: var(--ink-3);
  font-size: 12px;
  cursor: pointer;
  user-select: none;
  border-radius: 8px;
}
.cc-details > summary::-webkit-details-marker { display: none; }
.cc-details > summary:hover { color: var(--ink); }
.cc-details > summary .icon { transition: transform 150ms var(--ease); }
.cc-details[open] > summary .icon { transform: rotate(180deg); }
.details-content { padding: 0 16px 16px; }
.details-list { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; font-size: 12px; line-height: 1.6; }
.details-list dt { color: var(--ink-3); }
.details-list dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; user-select: text; }
.details-list .is-mono { font-family: var(--font-mono); font-size: 11.5px; }
.media-links { display: grid; gap: 12px; margin-top: 16px; }
.media-link { display: grid; justify-items: start; gap: 6px; }
.detail-url { display: block; max-width: 100%; overflow-wrap: anywhere; user-select: text; color: var(--ink-4); font: 11px/1.6 var(--font-mono); }

/* ---------- Stage & media ---------- */
.cc-canvas {
  position: relative;
  overflow: hidden;
  display: grid; place-items: center;
  background-color: var(--canvas);
  background-image: radial-gradient(var(--dots) 1px, transparent 1.2px);
  background-size: 16px 16px;
  background-position: -8px -8px;
}
.cc-frame {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  aspect-ratio: var(--frame-ratio, 1);
  height: var(--frame-height, 112px);
  max-width: calc(100% - 48px);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: color-mix(in oklab, var(--card) 72%, transparent);
  box-shadow: var(--shadow-1);
  color: var(--ink-3);
}
.cc-frame--free { aspect-ratio: auto; width: min(260px, calc(100% - 48px)); border-style: dashed; }
.cc-frame--audio { aspect-ratio: auto; flex-direction: row; gap: 10px; width: min(300px, calc(100% - 48px)); height: 52px; border-radius: var(--r-pill); }
.cc-frame-label { font: 11.5px/1.4 var(--font-mono); color: var(--ink-3); text-align: center; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cc-frame .icon { color: var(--ink-4); }

.media-grid { display: grid; gap: 2px; }
.media-view--with-audio .media-grid { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 14px 14px 0; background: var(--canvas); }
.media-view--with-audio .media-item { width: 168px; aspect-ratio: 1; border-radius: var(--r-media); box-shadow: var(--shadow-1); }
.media-view--with-audio .media-item .work-media { width: 100%; height: 100%; max-height: none; object-fit: cover; }
.media-grid--multiple { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.media-item { position: relative; margin: 0; min-width: 0; display: grid; place-items: center; background: var(--canvas); overflow: hidden; }
.media-item .work-media { display: block; width: 100%; height: auto; max-height: var(--media-max, 640px); object-fit: contain; }
.media-item--image .work-media { opacity: 0; filter: blur(14px); transform: scale(1.015); transition: opacity 600ms var(--ease), filter 700ms var(--ease), transform 700ms var(--ease); }
.media-item--image.is-ready .work-media { opacity: 1; filter: none; transform: none; }
video.work-media { min-height: 160px; background: oklch(0% 0 0); }
.media-index {
  position: absolute; left: 10px; bottom: 10px;
  padding: 2px 6px; border-radius: 6px;
  background: var(--media-scrim); color: oklch(98% 0 0);
  font: 10.5px/1.5 var(--font-mono);
  backdrop-filter: blur(8px);
}
.media-open {
  position: absolute; top: 10px; right: 10px;
  display: inline-flex; align-items: center; gap: 4px;
  height: 26px; padding: 0 9px;
  border: 0; border-radius: var(--r-pill);
  background: var(--media-scrim); color: oklch(98% 0 0);
  font: 500 11.5px/1 var(--font-sans);
  backdrop-filter: blur(8px);
  opacity: 0; transform: translateY(-2px);
  transition: opacity 150ms var(--ease), transform 150ms var(--ease);
  cursor: pointer;
}
.media-item:hover .media-open, .media-open:focus-visible { opacity: 1; transform: none; }
.media-item[data-error="true"] { min-height: 180px; }
.media-error { margin: 0; padding: 18px 24px; text-align: center; color: var(--danger); font-size: 12.5px; line-height: 1.7; }

/* Audio */
.audio-list { display: grid; gap: 8px; padding: 14px; }
.media-grid + .audio-list { padding-top: 10px; }
.audio-player {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px;
  padding: 10px 14px 10px 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow-1);
}
.audio-toggle {
  grid-row: span 2;
  display: grid; place-items: center;
  width: 36px; height: 36px;
  border: 0; border-radius: 50%;
  background: var(--brand); color: var(--on-brand);
  cursor: pointer;
  transition: background-color 150ms var(--ease), transform 150ms var(--ease);
}
.audio-toggle:hover { background: var(--brand-hover); }
.audio-toggle:active { transform: scale(.95); }
.audio-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
.audio-title { color: var(--ink); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.audio-time { color: var(--ink-3); font: 11.5px/1 var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.audio-progress {
  --progress: 0%;
  width: 100%; height: 16px; margin: 0;
  background: transparent;
  appearance: none; -webkit-appearance: none;
  cursor: pointer;
}
.audio-progress::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--brand) var(--progress), var(--active) var(--progress)); }
.audio-progress::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: var(--card); border: 2px solid var(--brand); box-shadow: var(--shadow-1); opacity: 0; transition: opacity 150ms var(--ease); }
.audio-player:hover .audio-progress::-webkit-slider-thumb, .audio-progress:focus-visible::-webkit-slider-thumb, .audio-player.is-playing .audio-progress::-webkit-slider-thumb { opacity: 1; }
.audio-progress::-moz-range-track { height: 4px; border-radius: 4px; background: var(--active); }
.audio-progress::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--brand); }
.audio-player audio { display: none; }
.audio-player[data-error="true"] .audio-toggle { background: var(--active); color: var(--ink-4); cursor: default; }

/* Generating */
.cc-progress-stage { padding: 20px 24px 16px; display: grid; justify-items: center; align-content: center; }
.cc-frame--live {
  overflow: hidden;
  border-color: var(--brand-line);
  background:
    linear-gradient(105deg, transparent 32%, color-mix(in oklab, var(--brand) 10%, transparent) 44%, color-mix(in oklab, oklch(100% 0 0) 8%, transparent) 50%, color-mix(in oklab, var(--brand) 8%, transparent) 56%, transparent 68%) 0 0 / 240% 100%,
    color-mix(in oklab, var(--card) 82%, transparent);
  box-shadow: var(--shadow-1), 0 0 48px color-mix(in oklab, var(--brand) 9%, transparent);
  animation: cc-develop 2.4s var(--ease) infinite;
}
.cc-live-copy { display: grid; justify-items: center; gap: 4px; padding: 0 12px; text-align: center; }
.cc-live-title { color: var(--ink); font-size: 13px; font-weight: 500; }
.cc-live-meta { margin: 12px 0 0; max-width: 100%; color: var(--ink-3); font: 11.5px/1.4 var(--font-mono); font-variant-numeric: tabular-nums; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-progress-line { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; background: var(--brand-soft); }
.cc-progress-line::after { content: ""; position: absolute; inset: 0; width: 34%; background: var(--brand); border-radius: 2px; animation: cc-slide 1.8s var(--ease) infinite; }

.cc-empty-copy { display: grid; justify-items: center; gap: 6px; padding: 28px 24px; text-align: center; }
.cc-empty-title { margin: 0; color: var(--ink); font-size: 14px; font-weight: 500; }
.cc-empty-note { margin: 0; color: var(--ink-3); font-size: 12px; line-height: 1.6; }

@keyframes cc-breathe { 50% { opacity: .35; } }
@keyframes cc-develop { from { background-position: 100% 0, 0 0; } to { background-position: -100% 0, 0 0; } }
@keyframes cc-slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@keyframes cc-spin { to { transform: rotate(360deg); } }

.cc-spinner { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: cc-spin .8s linear infinite; flex: none; }

@media (prefers-reduced-motion: reduce) {
  .cohub-mount *, .cohub-mount *::before, .cohub-mount *::after { animation: none !important; transition: none !important; }
  .media-item--image .work-media { opacity: 1; filter: none; transform: none; }
}

/* Result and publication card. Shared tokens and components live in tokens.css. */

.cohub-card .card-media { background: var(--canvas); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cohub-card .card-media:empty { display: none; }
.cohub-card .cc-progress-stage, .cohub-card .card-empty-stage { min-height: 220px; }
.card-empty-stage { display: grid; place-items: center; align-content: center; gap: 4px; padding: 28px 24px; }
.card-empty-stage .cc-empty-copy { padding: 8px 0 0; }
.cc-frame--failed { color: var(--danger); border-color: var(--danger-line); background: color-mix(in oklab, var(--danger) 6%, var(--card)); }
.cc-frame--failed .icon { color: var(--danger); }

.publication-stage { min-height: 220px; place-items: stretch; padding: 28px; }
.publication-plate { display: grid; align-content: end; gap: 10px; min-height: 164px; }
.publication-eyebrow { color: var(--brand-ink); font: 500 11px/1 var(--font-sans); letter-spacing: .08em; }
.publication-name { margin: 0; max-width: 92%; color: var(--ink); font-size: clamp(24px, 5vw, 36px); font-weight: 600; line-height: 1.2; letter-spacing: -.03em; overflow-wrap: anywhere; }
.publication-host { color: var(--ink-3); font: 12px/1.4 var(--font-mono); }

.card-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; }
.card-caption { flex: 1; min-width: 0; }
.card-title { margin: 0; color: var(--ink); font-size: 14.5px; font-weight: 600; line-height: 1.4; letter-spacing: -.01em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-prompt { margin: 3px 0 0; color: var(--ink-3); font-size: 12.5px; line-height: 1.55; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-meta { margin: 6px 0 0; color: var(--ink-4); font: 11.5px/1.5 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; flex-shrink: 0; }

.card-notices { display: grid; gap: 6px; padding: 0 16px 14px; }
.card-notices[hidden] { display: none; }
.cohub-card .details-content { padding-top: 0; }

@media (max-width: 520px) {
  .card-footer { flex-direction: column; align-items: stretch; gap: 12px; }
  .card-actions { justify-content: flex-start; }
  .publication-stage { padding: 22px; }
}

/* Composer: the inline card is a Cohub composer; the expanded panel is the same form with every setting. */

.cohub-composer { container: composer / inline-size; display: flex; flex-direction: column; transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); }
.cohub-composer[data-layout="inline"]:focus-within { border-color: var(--brand-line); box-shadow: var(--shadow-1), 0 0 0 3px var(--brand-softer); }
.composer-save-state { color: var(--ink-4); font-size: 12px; white-space: nowrap; margin-right: 2px; }
.composer-save-state:empty { display: none; }

/* ---------- Stage ---------- */
.composer-stage { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--canvas); }
.composer-canvas { min-height: 148px; padding: 26px 24px; --frame-height: 96px; }
.composer-canvas-hint { margin: 14px 0 0; text-align: center; color: var(--ink-4); font-size: 11.5px; }
.cohub-composer[data-layout="inline"] .composer-canvas-hint { display: none; }
.composer-stage .media-view { --media-max: 480px; }

/* Reference tiles on the stage */
.composer-canvas--refs { display: block; padding: 14px; --tile: 84px; }
.ref-strip { display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: thin; }
.ref-tile { position: relative; flex: none; width: var(--tile); margin: 0; }
.ref-thumb {
  position: relative; display: grid; place-items: center;
  width: 100%; aspect-ratio: 1;
  overflow: hidden;

.ref-glyph { color: var(--ink-3); display: grid; place-items: center; }
.ref-name { max-width: 100%; color: var(--ink-2); font-size: 11px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.ref-size { color: var(--ink-4); font: 10.5px/1.3 var(--font-mono); }
.ref-kind { position: absolute; left: 6px; bottom: 6px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--media-scrim); color: oklch(98% 0 0); }

  background: var(--card); color: var(--ink-2);
  font: 11.5px/1 var(--font-sans); text-align: center; text-align-last: center;
  appearance: none; -webkit-appearance: none; cursor: pointer;
}
.ref-role:hover:not(:disabled) { border-color: var(--line-heavy); color: var(--ink); }
.ref-caption.is-missing .ref-role { border-color: var(--danger-line); color: var(--danger); background: var(--danger-soft); }
.ref-remove {
  position: absolute; top: 5px; right: 5px;
  display: grid; place-items: center;
  width: 22px; height: 22px; padding: 0;

  width: var(--tile); aspect-ratio: 1;
  border: 1px dashed var(--line-heavy); border-radius: var(--r-media);
  background: transparent; color: var(--ink-3);

  transition: border-color 150ms var(--ease), color 150ms var(--ease), background-color 150ms var(--ease);
}
.ref-add:hover { border-color: var(--brand-line); color: var(--brand-ink); background: var(--brand-softer); }

/* ---------- Feedback ---------- */
.composer-dock { display: flex; flex-direction: column; }
.composer-feedback { display: grid; gap: 6px; padding: 10px 14px 0; }
.cohub-composer[data-layout="inline"] .composer-feedback { order: 2; padding: 0 14px 12px; }
.composer-feedback[hidden] { display: none; }
.composer-conflict-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 0; }

/* ---------- Composer box ---------- */
.composer-box { position: relative; }
.composer-prompt-input {
  display: block; width: 100%;
  margin: 0; padding: 12px 16px 6px;
  border: 0; outline: 0; border-radius: 0;
  background: transparent; color: var(--ink);
  font: 400 15px/24px var(--font-sans);
  resize: none;
  field-sizing: content;
  min-height: calc(48px + 18px);
  max-height: calc(24px * 6 + 18px);
  overflow-y: auto;
}
.composer-prompt-input::placeholder { color: var(--ink-4); }
.composer-prompt-input:disabled { color: var(--ink-2); cursor: default; }
.composer-box.is-synced .composer-prompt-input { animation: cc-synced 2.8s var(--ease); }

.composer-toolbar { display: flex; align-items: flex-end; gap: 10px; padding: 4px 10px 10px; }
.composer-toolbar-start { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; flex: 1 1 auto; min-width: 0; }
.composer-toolbar-end { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
.composer-model, .composer-chips { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
.composer-chips[hidden] { display: none; }
.composer-attach {
  display: grid; place-items: center;
  width: 30px; height: 30px; padding: 0;
  border: 0; border-radius: 50%;
  background: transparent; color: var(--ink-3);
  cursor: pointer;
  transition: background-color 150ms var(--ease), color 150ms var(--ease);
}
.composer-attach:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.composer-attach:disabled { opacity: .45; cursor: default; }

.chip-select {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  flex: 0 1 auto;
  height: 28px; min-width: 0; max-width: min(260px, 100%); padding: 0 9px 0 11px;
  border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  color: var(--ink-2);
  font: 12.5px/1 var(--font-sans); font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: border-color 150ms var(--ease), color 150ms var(--ease), background-color 150ms var(--ease);
}
.chip-select:hover:not(:has(select:disabled)) { border-color: var(--line-heavy); color: var(--ink); background: var(--hover); }
.chip-select:focus-within { border-color: var(--brand-line); box-shadow: 0 0 0 3px var(--brand-ring); }
.chip-select:has(select:disabled) { cursor: default; opacity: .6; }
.chip-select-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-select-chevron { display: grid; place-items: center; color: var(--ink-4); flex: none; }
.chip-select select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; appearance: none; -webkit-appearance: none; cursor: inherit; font: inherit; border: 0; }
.chip-select select:focus-visible { outline: 0; box-shadow: none; }
.chip-select--model { color: var(--ink); font-weight: 500; }

.composer-price { color: var(--ink-3); font: 12.5px/1 var(--font-sans); font-variant-numeric: tabular-nums; white-space: nowrap; padding: 0 4px; }
.composer-generate { height: 30px; padding: 0 10px 0 14px; gap: 8px; font-size: 13px; font-weight: 600; }
.composer-generate:disabled { opacity: 1; background: var(--field); color: var(--ink-4); }
.composer-kbd { padding: 2px 5px; border-radius: 5px; background: color-mix(in oklab, var(--on-brand) 18%, transparent); color: inherit; font: 500 11px/1.2 var(--font-sans); letter-spacing: .02em; opacity: .9; }
.composer-generate:disabled .composer-kbd { background: transparent; padding: 0; opacity: .8; }
.composer-generate.is-busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: cc-spin .8s linear infinite; }

/* ---------- Expanded panel ---------- */
.composer-panel { padding: 0 20px 12px; }
.composer-panel[hidden] { display: none; }
.composer-section { padding: 16px 0; border-bottom: 1px solid var(--line); }
.composer-section:last-child { border-bottom: 0; }
.composer-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.composer-section-title { margin: 0; color: var(--ink-2); font-size: 12.5px; font-weight: 600; letter-spacing: .01em; }
.composer-section-note { color: var(--ink-4); font-size: 11.5px; text-align: right; }
.composer-fields { display: grid; gap: 12px; }
.composer-field { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 6px 14px; min-height: 30px; }
.composer-field--textarea, .composer-field--json, .composer-field--size, .composer-field--options { align-items: start; }
.composer-field--textarea .composer-field-label, .composer-field--json .composer-field-label, .composer-field--size .composer-field-label, .composer-field--options .composer-field-label { padding-top: 7px; }
.composer-field-label { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.composer-field-control { min-width: 0; }

.composer-segmented { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 10px; background: var(--field); border: 1px solid var(--line); }
.composer-segment {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 11px;
  border: 0; border-radius: 8px;
  background: transparent; color: var(--ink-3);
  font: 500 12.5px/1 var(--font-sans);
  cursor: pointer;
  transition: background-color 150ms var(--ease), color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.composer-segment:hover:not(:disabled) { color: var(--ink); }
.composer-segment[aria-checked="true"] { background: var(--selected); color: var(--ink); box-shadow: var(--shadow-1), 0 0 0 1px var(--line); }
.composer-options { display: flex; flex-wrap: wrap; gap: 6px; }
.composer-option {
  display: inline-flex; align-items: center; gap: 6px;
  height: 28px; padding: 0 11px;
  border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  background: var(--card); color: var(--ink-2);
  font: 12.5px/1 var(--font-sans); font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: border-color 150ms var(--ease), color 150ms var(--ease), background-color 150ms var(--ease);
}
.composer-option:hover:not(:disabled) { border-color: var(--line-heavy); color: var(--ink); }
.composer-option[aria-checked="true"] { border-color: var(--brand-line); background: var(--brand-soft); color: var(--ink); }
.composer-segment:disabled, .composer-option:disabled { cursor: default; opacity: .55; }
.ratio-glyph { display: inline-block; flex: none; height: 11px; width: calc(11px * var(--r, 1)); border: 1.5px solid currentColor; border-radius: 2.5px; opacity: .75; }
[aria-checked="true"] > .ratio-glyph { opacity: 1; }

.composer-slider { display: flex; align-items: center; gap: 12px; }
.composer-range { --fill: 0%; flex: 1; min-width: 80px; height: 18px; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; cursor: pointer; }
.composer-range::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--brand) var(--fill), var(--active) var(--fill)); }
.composer-range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: oklch(100% 0 0); border: 0; box-shadow: 0 0 0 1px var(--line-strong), var(--shadow-1); }
.composer-range:focus-visible { outline: 0; }
.composer-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 1px var(--brand), 0 0 0 4px var(--brand-ring); }
.composer-range::-moz-range-track { height: 4px; border-radius: 4px; background: var(--active); }
.composer-range::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--brand); }
.composer-range:disabled { opacity: .55; cursor: default; }
.composer-slider-value { min-width: 48px; color: var(--ink); font: 500 13px/1 var(--font-sans); font-variant-numeric: tabular-nums; text-align: right; }

.composer-switch { position: relative; width: 34px; height: 20px; padding: 0; border: 0; border-radius: var(--r-pill); background: var(--active); cursor: pointer; transition: background-color 150ms var(--ease); }
.composer-switch-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: oklch(100% 0 0); box-shadow: var(--shadow-1); transition: transform 150ms var(--ease); }
.composer-switch[aria-checked="true"] { background: var(--brand); }
.composer-switch[aria-checked="true"] .composer-switch-thumb { transform: translateX(14px); }
.composer-switch:disabled { opacity: .55; cursor: default; }

.composer-input {
  width: 100%; height: 30px; padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: var(--r-control);
  background: var(--card); color: var(--ink);
  font: 13px/1.4 var(--font-sans);
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
textarea.composer-input { height: auto; min-height: 64px; padding: 7px 10px; line-height: 1.6; resize: vertical; }
input[type="number"].composer-input, .composer-size-input, .composer-json { font-family: var(--font-mono); font-size: 12.5px; }
.composer-input::placeholder { color: var(--ink-4); font-family: var(--font-sans); }
.composer-input:hover:not(:disabled) { border-color: var(--line-heavy); }
.composer-input:focus { outline: 0; border-color: var(--brand-line); box-shadow: 0 0 0 3px var(--brand-softer); }
.composer-input[aria-invalid="true"] { border-color: var(--danger-line); box-shadow: 0 0 0 3px var(--danger-soft); }
.composer-input:disabled { opacity: .6; cursor: default; }
select.composer-input { appearance: none; -webkit-appearance: none; padding-right: 10px; cursor: pointer; }
.composer-size { display: grid; gap: 8px; }
.composer-size-input { max-width: 220px; }

.composer-disclosure { border-top: 0; }
.composer-disclosure > summary { padding: 14px 0; }
.composer-field-grid { padding: 0 0 6px; }
.composer-result-disclosure { border-top: 0; border-bottom: 1px solid var(--line); }
.composer-result-disclosure > summary { padding: 14px 0; }
.composer-result-disclosure .details-content { padding: 0 0 14px; }

.ref-link-row { display: flex; gap: 6px; }
.ref-link-type, .ref-link-role { flex: none; width: auto; min-width: 84px; }
.ref-link-url { flex: 1; min-width: 0; }
.composer-help { margin: 8px 0 0; color: var(--ink-4); font-size: 11.5px; line-height: 1.6; }

/* ---------- Drag and drop ---------- */
.composer-drop { position: absolute; inset: 0; z-index: 20; display: none; padding: 8px; pointer-events: none; }
.cohub-composer.is-dragging .composer-drop { display: block; }
.composer-drop-inner {
  display: grid; place-items: center; align-content: center; gap: 8px;
  height: 100%;
  border: 1.5px dashed var(--brand); border-radius: 12px;
  background: color-mix(in oklab, var(--card) 86%, transparent);
  color: var(--brand-ink);
  font-size: 13px; font-weight: 500;
  backdrop-filter: blur(3px);
}

/* ---------- Expanded: fill the panel, keep the composer docked ---------- */
.cohub-composer[data-layout="expanded"] { min-height: 100vh; border: 0; border-radius: 0; box-shadow: none; overflow: visible; }
.cohub-composer[data-layout="expanded"] .composer-rail {
  position: sticky; top: 0; z-index: 5;
  min-height: 52px; padding: 8px 12px 8px 20px;
  background: color-mix(in oklab, var(--card) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.cohub-composer[data-layout="expanded"] .composer-stage { border-top: 0; }
.cohub-composer[data-layout="expanded"] .composer-canvas { min-height: 260px; --frame-height: 176px; }
.cohub-composer[data-layout="expanded"] .composer-canvas--refs { min-height: 0; padding: 18px 20px; --tile: 112px; }
.cohub-composer[data-layout="expanded"] .composer-stage .media-view { --media-max: 58vh; }
.cohub-composer[data-layout="expanded"] .composer-panel { flex: 1; }
.cohub-composer[data-layout="expanded"] .composer-dock {
  position: sticky; bottom: 0; z-index: 5;
  padding: 18px 16px 16px;
  background: linear-gradient(to top, var(--card) 72%, color-mix(in oklab, var(--card) 0%, transparent));
}
.cohub-composer[data-layout="expanded"] .composer-feedback { padding: 0 2px 10px; }
.cohub-composer[data-layout="expanded"] .composer-box {
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  background: var(--card);
  box-shadow: var(--shadow-2);
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.cohub-composer[data-layout="expanded"] .composer-box:focus-within { border-color: var(--brand-line); box-shadow: var(--shadow-2), 0 0 0 3px var(--brand-softer); }
.cohub-composer[data-layout="expanded"] .composer-prompt-input { min-height: calc(24px * 3 + 18px); max-height: calc(24px * 12 + 18px); }

@keyframes cc-synced { 0% { background: var(--brand-soft); } 100% { background: transparent; } }

@media (max-width: 460px) {
  .composer-field { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .composer-field--textarea .composer-field-label, .composer-field--json .composer-field-label, .composer-field--size .composer-field-label { padding-top: 0; }
  .composer-panel { padding: 0 14px 10px; }
  .composer-save-state { display: none; }
}

/* Quick settings stay readable or step aside; the full controls are one click away in the expanded panel. */
@container composer (max-width: 560px) {
  .composer-chips { display: none !important; }
  .composer-toolbar-start { flex-wrap: nowrap; }
  .composer-prompt-input { font-size: 14.5px; }
}
@container composer (max-width: 380px) {
  .composer-price { display: none; }
  .composer-kbd { display: none; }
}
